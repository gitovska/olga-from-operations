[project]
name = "olga-from-operations"
version = "0.1.0"
description = "Daily coworking calendar reminders from Olga from Operations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "caldav>=2.0,<3",
    "icalendar>=7,<8",
    "niquests>=3,<4",
    "python-telegram-bot>=22,<23",
    "recurring-ical-events>=3.8,<4",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
